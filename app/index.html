<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ETN Savings Circles</title>
<meta name="description" content="Save together with friends, family or your community. Rotating savings circles (chama, susu, tontine) on Electroneum Smart Chain: no middleman, no fees.">
<meta name="theme-color" content="#060a13" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f7fb" media="(prefers-color-scheme: light)">
<meta property="og:title" content="ETN Savings Circles">
<meta property="og:description" content="Rotating savings circles on Electroneum Smart Chain. Everyone pays in, one member takes the pot each round.">
<meta property="og:type" content="website">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;650;700;800&family=Plus+Jakarta+Sans:wght@600;700;750;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="vendor/qrcode.js" defer></script>
</head>
<body>
<header class="top">
  <div class="bar">
    <a class="logo" href="#/" aria-label="Savings Circles home">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
        <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00c08b"/><stop offset=".55" stop-color="#1fb6ff"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs>
        <circle cx="16" cy="16" r="11" fill="none" stroke="url(#lg)" stroke-width="3.5"/>
        <circle cx="16" cy="5" r="3.4" fill="#00c08b"/><circle cx="25.5" cy="21.5" r="2.6" fill="#1fb6ff"/><circle cx="6.5" cy="21.5" r="2.6" fill="#7c5cff"/>
      </svg>
      <span>Savings Circles<small>on Electroneum</small></span>
    </a>
    <span class="spacer"></span>
    <span class="chip-net" id="net"><i></i><span></span></span>
    <span class="account"><span class="bal" id="bal"></span><button class="btn small primary" id="connect">Connect wallet</button></span>
  </div>
</header>

<main class="wrap">
  <div id="banners"></div>
  <div id="view" aria-live="polite"></div>
  <footer class="foot">
    <span>Non-custodial · no fees · no admin keys · open source</span>
    <span>Contract <a id="contract-link" target="_blank" rel="noopener"></a> · <a href="https://github.com/orvionx/etn-savings-circles" target="_blank" rel="noopener">GitHub</a></span>
  </footer>
</main>
<div id="toasts" aria-live="polite"></div>
<div id="modal-root"></div>

<script type="module" src="app.js"></script>
</body>
</html>
