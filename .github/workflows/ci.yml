name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Contract + browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Contract tests
        run: npx hardhat test
      - name: End-to-end browser tests
        run: npm run test:e2e
        env:
          E2E_OUT: e2e-screens
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screens
          path: e2e-screens
          if-no-files-found: ignore

  deploy:
    name: Deploy app to Netlify
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: netlify-production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Deploy
        run: npx --yes netlify-cli@17.38.1 deploy --prod --dir app --site "$NETLIFY_SITE_ID" --message "CI ${GITHUB_SHA::7}"
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
