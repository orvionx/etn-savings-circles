name: Keeper

# Keeps the demo circle going, draws payout orders, settles rounds that are due and posts reminders.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only report, don't send transactions"
        type: boolean
        default: false
      ping:
        description: "Send a status message to Telegram (checks the bot setup)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npx hardhat compile
      - name: Run demo crew
        if: ${{ !inputs.dry_run }}
        run: node scripts/demo-crew.js
        continue-on-error: true
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Run keeper
        run: node scripts/keeper.js ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.ping && '--ping' || '' }}
        env:
          KEEPER_PRIVATE_KEY: ${{ secrets.KEEPER_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          KEEPER_INTERVAL: "900"
